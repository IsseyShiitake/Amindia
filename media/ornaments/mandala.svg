<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#C59C4D" stroke-width="1.5">
  <!-- Am'India ornament — 12-fold lotus mandala, engraving style (original artwork) -->
  <defs>
    <g id="petal">
      <path d="M100 34 C 108 52, 108 66, 100 82 C 92 66, 92 52, 100 34 Z"/>
      <path d="M100 44 C 105 56, 105 66, 100 76 C 95 66, 95 56, 100 44 Z" stroke-width="1"/>
      <line x1="100" y1="24" x2="100" y2="30"/>
      <circle cx="100" cy="20" r="1.6" stroke-width="1"/>
    </g>
    <circle id="dot" cx="100" cy="62" r="1.8"/>
  </defs>
  <use href="#petal"/>
  <use href="#petal" transform="rotate(30 100 100)"/>
  <use href="#petal" transform="rotate(60 100 100)"/>
  <use href="#petal" transform="rotate(90 100 100)"/>
  <use href="#petal" transform="rotate(120 100 100)"/>
  <use href="#petal" transform="rotate(150 100 100)"/>
  <use href="#petal" transform="rotate(180 100 100)"/>
  <use href="#petal" transform="rotate(210 100 100)"/>
  <use href="#petal" transform="rotate(240 100 100)"/>
  <use href="#petal" transform="rotate(270 100 100)"/>
  <use href="#petal" transform="rotate(300 100 100)"/>
  <use href="#petal" transform="rotate(330 100 100)"/>
  <circle cx="100" cy="100" r="66" stroke-width="1"/>
  <circle cx="100" cy="100" r="70" stroke-width="0.75"/>
  <circle cx="100" cy="100" r="30"/>
  <circle cx="100" cy="100" r="24" stroke-width="1"/>
  <circle cx="100" cy="100" r="7"/>
  <circle cx="100" cy="100" r="3" stroke-width="1"/>
  <g stroke-width="1">
    <use href="#dot"/>
    <use href="#dot" transform="rotate(30 100 100)"/>
    <use href="#dot" transform="rotate(60 100 100)"/>
    <use href="#dot" transform="rotate(90 100 100)"/>
    <use href="#dot" transform="rotate(120 100 100)"/>
    <use href="#dot" transform="rotate(150 100 100)"/>
    <use href="#dot" transform="rotate(180 100 100)"/>
    <use href="#dot" transform="rotate(210 100 100)"/>
    <use href="#dot" transform="rotate(240 100 100)"/>
    <use href="#dot" transform="rotate(270 100 100)"/>
    <use href="#dot" transform="rotate(300 100 100)"/>
    <use href="#dot" transform="rotate(330 100 100)"/>
  </g>
</svg>
