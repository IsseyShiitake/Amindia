    <use href="#spoke" transform="rotate(195 60 60)"/>
    <use href="#spoke" transform="rotate(210 60 60)"/>
    <use href="#spoke" transform="rotate(225 60 60)"/>
    <use href="#spoke" transform="rotate(240 60 60)"/>
    <use href="#spoke" transform="rotate(255 60 60)"/>
    <use href="#spoke" transform="rotate(270 60 60)"/>
    <use href="#spoke" transform="rotate(285 60 60)"/>
