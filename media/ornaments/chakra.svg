  <circle cx="60" cy="60" r="46" stroke-width="0.75"/>
  <circle cx="60" cy="60" r="9"/>
  <circle cx="60" cy="60" r="3.5" stroke-width="1"/>
  <g id="spokes" stroke-width="1">
    <line id="spoke" x1="60" y1="60" x2="60" y2="14"/>
    <use href="#spoke" transform="rotate(15 60 60)"/>
    <use href="#spoke" transform="rotate(30 60 60)"/>
    <use href="#spoke" transform="rotate(45 60 60)"/>
    <use href="#spoke" transform="rotate(60 60 60)"/>
    <use href="#spoke" transform="rotate(75 60 60)"/>
    <use href="#spoke" transform="rotate(90 60 60)"/>
    <use href="#spoke" transform="rotate(105 60 60)"/>
    <use href="#spoke" transform="rotate(120 60 60)"/>
