<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="#C59C4D" stroke-width="1.5">
  <!-- Am'India ornament — 24-spoke chakra, decorative homage (original artwork) -->
